name: Remove

# Takes a package out of the repository: drops it from the database and
# deletes its files from R2. Remove its line from packages.txt first, or the
# next publish run puts it back.
#
# To roll back one bad release instead, delete that GitHub release or mark it
# as a prerelease and run the Publish workflow; it republishes the release
# that is now the latest.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to remove, e.g. omaframe"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  REPO_NAME: btsouth
  SIGNING_KEY: AA378A651D659C56BE5DB17B2F78D0FE524BB309

jobs:
  remove:
    name: Remove ${{ inputs.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PACKAGE: ${{ inputs.package }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the request
        run: |
          [[ "$PACKAGE" =~ ^[a-z0-9][a-z0-9@._+-]*$ ]] || {
            echo "::error::$PACKAGE is not a package name."; exit 1; }
          if grep -vE '^\s*(#|$)' packages.txt | awk '{print $1}' | grep -qxF -- "$PACKAGE"; then
            echo "::error::$PACKAGE is still in packages.txt. Remove that line first."; exit 1
          fi

      - name: Remove from the databases
        env:
          GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          got="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          [ "$got" = "$SIGNING_KEY" ] || {
            echo "::error::REPO_GPG_PRIVATE_KEY is $got but install.sh pins $SIGNING_KEY."; exit 1; }
          scripts/database.sh remove "$PACKAGE"

      - name: Publish the databases and delete the files
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Database first, files second: a client never sees a database that
          # names a file already deleted.
          if [ -d repo ]; then
            aws s3 cp repo/ "s3://$R2_BUCKET/" --recursive --endpoint-url "$endpoint" \
              --cache-control "no-cache"
          fi
          for arch in x86_64 aarch64; do
            aws s3 rm "s3://$R2_BUCKET/$arch/" --recursive --endpoint-url "$endpoint" \
              --exclude "*" --include "$PACKAGE-[0-9]*.pkg.tar.zst*"
          done
          echo "Removed $PACKAGE from https://pkgs.btso.dev"
