name: Publish

# Promotes the Arch packages attached to published GitHub releases into the
# btsouth pacman repository on Cloudflare R2, so users get them through
# `pacman -Syu`. Nothing is rebuilt: the repository serves the exact package
# from the release, signed here. Projects are listed in packages.txt.
#
# Download and inspection run without credentials. The signing key and the R2
# credentials are scoped to the later steps that need them.

on:
  # Every hour, publish any new release of a project in packages.txt.
  schedule:
    - cron: "17 * * * *"
  # Adding a project to packages.txt publishes it straight away.
  push:
    branches: [main]
    paths: [packages.txt]
  # Run by hand to publish now. Leave package and tag empty to publish
  # whatever is new; fill both in to publish one specific release.
  workflow_dispatch:
    inputs:
      package:
        description: "Package name from packages.txt, e.g. omaframe (empty: everything new)"
        type: string
      tag:
        description: "Release tag, e.g. v0.7.4 (required with package)"
        type: string
      dry_run:
        description: "Download and validate only; do not sign or publish"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  REPO_NAME: btsouth
  SIGNING_KEY: AA378A651D659C56BE5DB17B2F78D0FE524BB309

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download and check the release packages
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          HAS_CREDENTIALS: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
        run: |
          if [ -n "$PACKAGE$TAG" ]; then
            [ -n "$PACKAGE" ] && [ -n "$TAG" ] || {
              echo "::error::Give both package and tag, or neither."; exit 1; }
            scripts/plan.sh "$PACKAGE" "$TAG"
          else
            scripts/plan.sh
          fi
          publish=true
          if ! ls repo/*/*.pkg.tar.zst >/dev/null 2>&1; then
            echo "Nothing new to publish."; publish=false
          elif [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: validated, publishing nothing."; publish=false
          elif [ "$HAS_CREDENTIALS" != "true" ]; then
            echo "::warning::R2 credentials are not set, so nothing was published."; publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Sign the packages
        if: steps.plan.outputs.publish == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || {
            echo "::error::REPO_GPG_PRIVATE_KEY is not set."; exit 1; }
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Refuse to sign with anything other than the fingerprint install.sh
          # pins, so a wrong key cannot produce a repository no client trusts.
          got="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          [ "$got" = "$SIGNING_KEY" ] || {
            echo "::error::REPO_GPG_PRIVATE_KEY is $got but install.sh pins $SIGNING_KEY."; exit 1; }
          for pkg in repo/*/*.pkg.tar.zst; do
            gpg --batch --yes --local-user "$SIGNING_KEY" --detach-sign --no-armor "$pkg"
          done

      # Fetch the existing database so the other packages stay listed, add the
      # new package to it, and sign the result.
      - name: Rebuild the repository database
        if: steps.plan.outputs.publish == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for dir in repo/*/; do
            arch="$(basename "$dir")"
            for kind in db files; do
              # A missing database is expected the first time; any other
              # failure must not be mistaken for an empty repository.
              if aws s3api head-object --endpoint-url "$endpoint" --bucket "$R2_BUCKET" \
                   --key "$arch/$REPO_NAME.$kind.tar.gz" >/dev/null 2>head.err; then
                aws s3 cp "s3://$R2_BUCKET/$arch/$REPO_NAME.$kind.tar.gz" "$dir" \
                  --endpoint-url "$endpoint"
              elif ! grep -q 'Not Found\|404' head.err; then
                cat head.err; echo "::error::Could not read the existing $arch database."; exit 1
              fi
            done
            # repo-add ships with pacman, which the Ubuntu runner does not
            # have. It runs as the runner's uid, without the signing key; the
            # database is signed below on the runner.
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/$dir:/repo" -w /repo \
              archlinux:base bash -euc "repo-add $REPO_NAME.db.tar.gz *.pkg.tar.zst"
            for kind in db files; do
              gpg --batch --yes --local-user "$SIGNING_KEY" --detach-sign --no-armor \
                "$dir$REPO_NAME.$kind.tar.gz"
              # pacman requests `<repo>.db` and `<repo>.db.sig`.
              rm -f "$dir$REPO_NAME.$kind" "$dir$REPO_NAME.$kind.tar.gz.old"
              cp "$dir$REPO_NAME.$kind.tar.gz" "$dir$REPO_NAME.$kind"
              cp "$dir$REPO_NAME.$kind.tar.gz.sig" "$dir$REPO_NAME.$kind.sig"
            done
            ls -la "$dir"
          done

      - name: Publish to R2
        if: steps.plan.outputs.publish == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Packages first, database last: a client that syncs mid-upload then
          # sees the old database, which names only files already present.
          aws s3 cp repo/ "s3://$R2_BUCKET/" --recursive --endpoint-url "$endpoint" \
            --exclude "*" --include "*.pkg.tar.zst" --include "*.pkg.tar.zst.sig"
          aws s3 cp repo/ "s3://$R2_BUCKET/" --recursive --endpoint-url "$endpoint" \
            --exclude "*.pkg.tar.zst*" --cache-control "no-cache"
          # The key and installer are published from this repository, so what
          # users fetch is always the reviewed copy.
          aws s3 cp btsouth.gpg "s3://$R2_BUCKET/btsouth.gpg" --endpoint-url "$endpoint" \
            --content-type application/pgp-keys --cache-control "no-cache"
          aws s3 cp install.sh "s3://$R2_BUCKET/install.sh" --endpoint-url "$endpoint" \
            --content-type "text/x-shellscript; charset=utf-8" --cache-control "no-cache"
          echo "Published to https://pkgs.btso.dev"
