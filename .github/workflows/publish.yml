name: Publish

# Promotes the Arch package attached to a published GitHub release into the
# btsouth pacman repository on Cloudflare R2, so users get it through
# `pacman -Syu`. Nothing is rebuilt: the repository serves the exact package
# from the release, signed here.
#
# Download and inspection run without credentials. The signing key and the R2
# credentials are scoped to the later steps that need them.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package and repository name, e.g. omaframe (must be in packages.txt)"
        required: true
        type: string
      tag:
        description: "Published release tag, e.g. v0.7.4"
        required: true
        type: string
      dry_run:
        description: "Download and validate only; do not sign or publish"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  REPO_NAME: btsouth
  SIGNING_KEY: AA378A651D659C56BE5DB17B2F78D0FE524BB309

jobs:
  publish:
    name: Publish ${{ inputs.package }} ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PACKAGE: ${{ inputs.package }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the release is publishable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -qxF -- "$PACKAGE" packages.txt || {
            echo "::error::$PACKAGE is not listed in packages.txt."; exit 1; }
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]] || {
            echo "::error::$TAG does not look like a release tag."; exit 1; }
          state="$(gh release view "$TAG" -R "btsouth/$PACKAGE" --json isDraft,isPrerelease)" || {
            echo "::error::btsouth/$PACKAGE has no published release $TAG."; exit 1; }
          [ "$(jq -r .isDraft <<<"$state")" = "false" ] || {
            echo "::error::$TAG is still a draft."; exit 1; }
          [ "$(jq -r .isPrerelease <<<"$state")" = "false" ] || {
            echo "::error::$TAG is a prerelease; the repository is stable only."; exit 1; }

      - name: Download and check the release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "$TAG" -R "btsouth/$PACKAGE" -D assets \
            -p "$PACKAGE-*.pkg.tar.zst" -p 'SHA256SUMS*'
          shopt -s nullglob
          found=0
          for arch in x86_64 aarch64 any; do
            for pkg in assets/"$PACKAGE"-*-"$arch".pkg.tar.zst; do
              file="$(basename "$pkg")"
              # The package must be what the release says it is: right name,
              # right version, right architecture.
              info="$(tar --zstd -xOf "$pkg" .PKGINFO)"
              name="$(sed -n 's/^pkgname = //p' <<<"$info")"
              ver="$(sed -n 's/^pkgver = //p' <<<"$info")"
              parch="$(sed -n 's/^arch = //p' <<<"$info")"
              [ "$name" = "$PACKAGE" ] || {
                echo "::error::$file contains package $name."; exit 1; }
              [ "${ver%-*}" = "${TAG#v}" ] || {
                echo "::error::$file is version $ver but the tag is $TAG."; exit 1; }
              [ "$parch" = "$arch" ] || {
                echo "::error::$file is built for $parch."; exit 1; }
              [ "$file" = "$name-$ver-$parch.pkg.tar.zst" ] || {
                echo "::error::$file is not named $name-$ver-$parch.pkg.tar.zst."; exit 1; }
              sum="$(sha256sum "$pkg" | cut -d ' ' -f 1)"
              if cat assets/SHA256SUMS* 2>/dev/null | grep -q "$file"; then
                cat assets/SHA256SUMS* | grep -qE "^$sum [ *]$file\$" || {
                  echo "::error::$file does not match the release SHA256SUMS."; exit 1; }
              else
                echo "::warning::The release has no checksum for $file."
              fi
              # An `any` package is served from every architecture directory.
              if [ "$arch" = any ]; then dests="x86_64 aarch64"; else dests="$arch"; fi
              for dest in $dests; do
                mkdir -p "repo/$dest"
                cp "$pkg" "repo/$dest/"
              done
              echo "$file  $sum"
              found=1
            done
          done
          [ "$found" = 1 ] || {
            echo "::error::Release $TAG has no $PACKAGE-<version>-<arch>.pkg.tar.zst asset."; exit 1; }

      - name: Sign the packages
        if: ${{ !inputs.dry_run }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || {
            echo "::error::REPO_GPG_PRIVATE_KEY is not set."; exit 1; }
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Refuse to sign with anything other than the fingerprint install.sh
          # pins, so a wrong key cannot produce a repository no client trusts.
          got="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          [ "$got" = "$SIGNING_KEY" ] || {
            echo "::error::REPO_GPG_PRIVATE_KEY is $got but install.sh pins $SIGNING_KEY."; exit 1; }
          for pkg in repo/*/*.pkg.tar.zst; do
            gpg --batch --yes --local-user "$SIGNING_KEY" --detach-sign --no-armor "$pkg"
          done

      # Fetch the existing database so the other packages stay listed, add the
      # new package to it, and sign the result.
      - name: Rebuild the repository database
        if: ${{ !inputs.dry_run }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for dir in repo/*/; do
            arch="$(basename "$dir")"
            for kind in db files; do
              # A missing database is expected the first time; any other
              # failure must not be mistaken for an empty repository.
              if aws s3api head-object --endpoint-url "$endpoint" --bucket "$R2_BUCKET" \
                   --key "$arch/$REPO_NAME.$kind.tar.gz" >/dev/null 2>head.err; then
                aws s3 cp "s3://$R2_BUCKET/$arch/$REPO_NAME.$kind.tar.gz" "$dir" \
                  --endpoint-url "$endpoint"
              elif ! grep -q 'Not Found\|404' head.err; then
                cat head.err; echo "::error::Could not read the existing $arch database."; exit 1
              fi
            done
            # repo-add ships with pacman, which the Ubuntu runner does not
            # have. It runs as the runner's uid, without the signing key; the
            # database is signed below on the runner.
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/$dir:/repo" -w /repo \
              archlinux:base bash -euc "repo-add $REPO_NAME.db.tar.gz *.pkg.tar.zst"
            for kind in db files; do
              gpg --batch --yes --local-user "$SIGNING_KEY" --detach-sign --no-armor \
                "$dir$REPO_NAME.$kind.tar.gz"
              # pacman requests `<repo>.db` and `<repo>.db.sig`.
              rm -f "$dir$REPO_NAME.$kind" "$dir$REPO_NAME.$kind.tar.gz.old"
              cp "$dir$REPO_NAME.$kind.tar.gz" "$dir$REPO_NAME.$kind"
              cp "$dir$REPO_NAME.$kind.tar.gz.sig" "$dir$REPO_NAME.$kind.sig"
            done
            ls -la "$dir"
          done

      - name: Publish to R2
        if: ${{ !inputs.dry_run }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Packages first, database last: a client that syncs mid-upload then
          # sees the old database, which names only files already present.
          aws s3 cp repo/ "s3://$R2_BUCKET/" --recursive --endpoint-url "$endpoint" \
            --exclude "*" --include "*.pkg.tar.zst" --include "*.pkg.tar.zst.sig"
          aws s3 cp repo/ "s3://$R2_BUCKET/" --recursive --endpoint-url "$endpoint" \
            --exclude "*.pkg.tar.zst*" --cache-control "no-cache"
          # The key and installer are published from this repository, so what
          # users fetch is always the reviewed copy.
          aws s3 cp btsouth.gpg "s3://$R2_BUCKET/btsouth.gpg" --endpoint-url "$endpoint" \
            --content-type application/pgp-keys --cache-control "no-cache"
          aws s3 cp install.sh "s3://$R2_BUCKET/install.sh" --endpoint-url "$endpoint" \
            --content-type "text/x-shellscript; charset=utf-8" --cache-control "no-cache"
          echo "Published $PACKAGE $TAG to https://pkgs.btso.dev"
